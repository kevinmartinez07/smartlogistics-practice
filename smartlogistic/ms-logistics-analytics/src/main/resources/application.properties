server.port=8083

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/logistics_analytics

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:smartlogistics}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:change-this-rabbitmq-password}

# Actuator / Prometheus
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always

# OpenTelemetry / Jaeger
management.tracing.sampling.probability=0.0
otel.exporter.otlp.endpoint=http://localhost:4318
