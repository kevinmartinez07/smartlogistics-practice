server.port=8084

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-this-auth-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:change-this-jwt-secret-before-starting}
jwt.expiration-ms=86400000

# Actuator / Prometheus
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always

# OpenTelemetry / Jaeger
management.tracing.sampling.probability=0.0
otel.exporter.otlp.endpoint=http://localhost:4318
